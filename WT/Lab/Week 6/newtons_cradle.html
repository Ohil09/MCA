<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newton's Cradle</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: black;
      }

      .flex-container {
        width: 100%;
        height: 100vh;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
      }

      .outer-frame {
        width: 700px;
        height: 400px;

        background-color: rgb(161, 31, 31);
        border-top: 20px solid rgb(209, 209, 36);
        border-radius: 10px;
        position: relative;
      }

      .cradle {
        width: 350px;
        height: 300px;

        position: absolute;
        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);
      }
      .ledge {
        width: 350px;
        height: 15px;

        background-color: rgb(0, 0, 0);

        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      .pendulum {
        width: 70px;
        height: 250px;

        position: absolute;
        top: 0;

        transform-origin: top center;
      }

      .string {
        width: 2px;
        height: 180px;

        background-color: white;

        position: absolute;
        top: 0;
        left: 50%;
      }

      .ball {
        width: 70px;
        height: 70px;

        background-color: silver;
        border-radius: 50%;

        position: absolute;
        bottom: 0;
        left: 50%;

        transform: translateX(-50%);
      }

      .p1 {
        left: 0;
        animation: left-ball 2s ease-in-out infinite;
      }

      .p2 {
        left: 70px;
      }

      .p3 {
        left: 140px;
      }

      .p4 {
        left: 210px;
      }

      .p5 {
        left: 280px;
        animation: right-ball 2s ease-in-out infinite;
      }

      @keyframes left-ball {
        0% {
          transform: rotate(0deg);
        }

        25% {
          transform: rotate(30deg);
        }

        50% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(0deg);
        }
      }

      @keyframes right-ball {
        0% {
          transform: rotate(0deg);
        }

        50% {
          transform: rotate(0deg);
        }

        75% {
          transform: rotate(-30deg);
        }

        100% {
          transform: rotate(0deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="flex-container">
      <h1>NEWTONS CRADLE</h1>
      <div class="outer-frame">
        <div class="cradle">
          <div class="ledge"></div>
          <div class="pendulum p1">
            <div class="string"></div>
            <div class="ball"></div>
          </div>

          <div class="pendulum p2">
            <div class="string"></div>
            <div class="ball"></div>
          </div>

          <div class="pendulum p3">
            <div class="string"></div>
            <div class="ball"></div>
          </div>

          <div class="pendulum p4">
            <div class="string"></div>
            <div class="ball"></div>
          </div>

          <div class="pendulum p5">
            <div class="string"></div>
            <div class="ball"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
