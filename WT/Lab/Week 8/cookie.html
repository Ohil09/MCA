
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information</title>
</head>
<body>
    <h2>Enter User Information</h2>

    <form onsubmit="saveInfo(event)">
        <label>Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" id="email" required>
        <br><br>

        <label>Age:</label>
        <input type="number" id="age" min="1" required>
        <br><br>

        <button type="submit">Save Information</button>
        <button type="button" onclick="displayInfo()">Display Information</button>
    </form>

    <p id="output"></p>

    <script>
        function setCookie(name, value) {
            document.cookie = name + "=" + encodeURIComponent(value) +
                "; max-age=2592000; path=/; SameSite=Lax";
        }

        function getCookie(name) {
            var cookies = document.cookie.split("; ");

            for (var i = 0; i < cookies.length; i++) {
                var parts = cookies[i].split("=");
                if (parts[0] === name) {
                    return decodeURIComponent(parts.slice(1).join("="));
                }
            }
            return "";
        }

        function saveInfo(event) {
            event.preventDefault();

            setCookie("userName", document.getElementById("name").value.trim());
            setCookie("userEmail", document.getElementById("email").value.trim());
            setCookie("userAge", document.getElementById("age").value);

            displayInfo();
        }

        function displayInfo() {
            var name = getCookie("userName");
            var email = getCookie("userEmail");
            var age = getCookie("userAge");

            if (name === "" || email === "" || age === "") {
                document.getElementById("output").textContent =
                    "No saved information found.";
                return;
            }

            document.getElementById("output").textContent =
                "Name: " + name + " | Email: " + email + " | Age: " + age;
        }

        displayInfo();
    </script>
</body>
</html>
