<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Window</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .flex-box {
        width: 100%;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      button {
        padding: 15px;
        border: none;
        border-radius: 10px;
        background-color: black;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="flex-box">
      <button onclick="transfer()">Open New Browser Window</button>
    </div>
    <script>
      function transfer() {
        const new_window = window.open("", "_blank", "width=500,height=500");
        if (new_window) {
          new_window.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>New Window</title>
                    </head>
                    <body>
                        <h1>Hello World!</h1>
                        <p>This text is displayed in a new browser window.</p>
                    </body>

                    </html>
                `);

          new_window.document.close();
        }
      }
    </script>
  </body>
</html>
