<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Animated Circle</title>
<style>
  body {
    margin: 0;
    padding: 20px;
  }

  .circle {
    width: 200px;
    height: 200px;
    position: relative;
    background: yellow;
    animation-name: mooncircle;
    animation-duration: 5s;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }

  @keyframes mooncircle {
    0% {
      left: 0px;
      top: 0px;
      border-radius: 0;
    }
    100% {
      left: 500px;
      top: 500px;
      border-radius: 50%;
	  background: orange;
    }
  }
</style>
</head>
<body>

<div class="circle"></div>

</body>
</html>
