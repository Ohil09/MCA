<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Planet Orbit</title>
  <style>
    body {
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Sun */
    .sun {
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, yellow 60%, orange 90%);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 40px 15px rgba(255, 200, 0, 0.7);
    }

    /* Orbit Path */
    .orbit {
      width: 300px;
      height: 300px;
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -150px;
      margin-left: -150px;
      animation: rotate 8s linear infinite;
    }

    /* Planet */
    .planet {
      width: 50px;
      height: 50px;
      background: dodgerblue;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-left: 130px; /* orbit radius */
      margin-top: -20px;
      box-shadow: 0 0 15px 5px rgba(30,144,255,0.6);
    }

    /* Rotation Animation */
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="sun"></div>
  <div class="orbit">
    <div class="planet"></div>
  </div>
</body>
</html>
