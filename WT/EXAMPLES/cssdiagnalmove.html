<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two Diagonal Animations</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }

    .main {
      width: 100%;
      height: 100vh;
      background: #f0f0f0;
      position: relative;
      overflow: hidden;
    }

    .box {
      width: 100px;
      height: 100px;
      background: crimson;
      position: absolute;
      top: 0;
      left: 0;
      /* Run two animations one after another */
      animation: primaryDiagonal 3s linear forwards,
                 secondaryDiagonal 3s linear forwards 3s;
    }

    /* Primary diagonal: top-left → bottom-right */
    @keyframes primaryDiagonal {
      from { top: 0; left: 0; }
      to   { top: calc(100% - 100px); left: calc(100% - 100px); }
    }

    /* Secondary diagonal: bottom-right → top-left */
    @keyframes secondaryDiagonal {
      from { top: 0; left: calc(100% - 100px); }
      to   { top: calc(100% - 100px); left: 0; }
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="box"></div>
  </div>
</body>
</html>
