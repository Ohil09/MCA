<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunar Eclipse</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: black;
      }
      .flex-container {
        width: 100%;
        height: 100vh;

        display: flex;
        flex-direction: column;
        gap: 20px;
        justify-content: center;
        align-items: center;
      }
      h1 {
        color: white;
      }
      .outer_frame {
        width: 1000px;
        height: 400px;
        border-radius: 20px;
        background: radial-gradient(circle at center, #172554, #020617);
        position: relative;
        overflow: hidden;
      }
      .sun {
        width: 300px;
        height: 300px;

        background-color: yellow;
        border-radius: 50%;

        position: absolute;
        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        box-shadow:
          0 0 20px yellow,
          0 0 40px orange;
      }
      .moon {
        width: 300px;
        height: 300px;

        background-color: gray;
        border-radius: 50%;

        position: absolute;
        top: 50%;
        left: -300px;

        box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);

        transform: translateY(-50%);
        animation: eclipse 12s linear infinite;
      }
      @keyframes eclipse {
        0% {
          left: -300px;
        }
        50% {
          left: 50%;
          transform: translate(-50%, -50%);
        }
        100% {
          left: 1300px;
          transform: translateY(-50%);
        }
      }
    </style>
  </head>
  <body>
    <div class="flex-container">
      <h1>Lunar Eclipse</h1>
      <div class="outer_frame">
        <!-- Sun -->
        <div class="sun"></div>

        <!-- Moon -->
        <div class="moon"></div>
      </div>
    </div>
  </body>
</html>
