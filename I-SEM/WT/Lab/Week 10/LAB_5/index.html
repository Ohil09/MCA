<!DOCTYPE html>
<html>
<head>
    <title>Employee Search</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ddd;
        }

        input {
            padding: 8px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>

    <script>
        function searchEmployee() {
            var name = document.getElementById("name").value;
            var xhttp = new XMLHttpRequest();

            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    document.getElementById("result").innerHTML =
                        this.responseText;
                }
            };

            xhttp.open("GET", "search.php?name=" + encodeURIComponent(name), true);
            xhttp.send();
        }
    </script>
</head>

<body>

<div class="container">
    <h2>Search Employee</h2>

    Enter Employee Name:<br>
    <input type="text" id="name" placeholder="Enter name">

    <button onclick="searchEmployee()">Search</button>

    <div id="result"></div>
</div>

</body>
</html>
