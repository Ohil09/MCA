<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lunar Eclipse</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: black;
        color: white;
        font-family: Arial, sans-serif;
      }

      .container {
        width: 90%;
        max-width: 1000px;
        height: 100vh;
        margin: auto;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
      }

      .space {
        width: 100%;
        max-width: 900px;
        height: 450px;

        position: relative;
      }

      .sun {
        width: 140px;
        height: 140px;

        background-color: #ffc400;
        border-radius: 50%;

        position: absolute;
        top: 50%;
        left: 15%;

        transform: translate(-50%, -50%);
        box-shadow:
        0 0 20px yellow,
          0 0 40px orange;
      }

      .earth {
        width: 100px;
        height: 100px;

        background-color: #159bd3;
        border-radius: 50%;

        position: absolute;
        top: 50%;
        left: 55%;

        transform: translate(-50%, -50%);
        z-index: 2;
      }

      .orbit {
        width: 300px;
        height: 300px;

        position: absolute;
        top: 50%;
        left: 55%;

        transform: translate(-50%, -50%);
        transform-origin: center;
        border-radius: 50%;

        animation: orbit 16s linear infinite;
      }

      .moon {
        width: 40px;
        height: 40px;

        background-color: gray;
        border-radius: 50%;

        position: absolute;
        top: -20px;
        left: 50%;

        transform: translateX(-50%);

        animation: eclipse 16s linear infinite;
      }

      @keyframes orbit {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }

        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      @keyframes eclipse {
        0%,20% {
          background-color: gray;
          box-shadow: none;
        }

        25%,30% {
          background-color: #b22222;
          box-shadow:0 0 20px red,
            0 0 40px darkred;
        }
        35%,100% {
          background-color: gray;
          box-shadow: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>LUNAR ECLIPSE</h1>

      <div class="space">
        <div class="sun"></div>
        <div class="earth"></div>
        <div class="orbit">
          <div class="moon"></div>
        </div>
      </div>
    </div>
  </body>
</html>
