<!DOCTYPE html>
<html>
<head>
    <title>Responsive Web Page</title>

    <!-- Viewport Meta Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background-color: steelblue;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
        }

        .box {
            width: 33.33%;
            padding: 15px;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        /* Tablet */
        @media screen and (max-width: 768px) {
            .box {
                width: 50%;
            }
        }

        /* Mobile */
        @media screen and (max-width: 480px) {
            .box {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<header>
    <h1>Responsive Website</h1>
</header>

<div class="container">

    <div class="box">
        <h2>Section 1</h2>
        <img src="images/1.jpg" alt="Image 1">
        <p>First content section.</p>
    </div>

    <div class="box">
        <h2>Section 2</h2>
        <img src="images/Musashi.jpg" alt="Image 2">
        <p>Second content section.</p>
    </div>

    <div class="box">
        <h2>Section 3</h2>
        <img src="images/Shizuku.jpg" alt="Image 3">
        <p>Third content section.</p>
    </div>

</div>

</body>
</html>
