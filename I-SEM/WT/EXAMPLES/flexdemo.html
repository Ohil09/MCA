<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Use-Cases</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
 * {
  box-sizing: border-box;
}
  /*
flex-direction: row | row-reverse | column | column-reverse

flex-wrap: nowrap | wrap | wrap-reverse

flex-flow: flex-direction || flex-wrap>  e.g. row wrap 

justify-content: flex-start | flex-end | center | space-between | space-around | space-evenly | start | end | left | right

align-items: stretch | flex-start | flex-end | center | baseline | first baseline | last baseline | start | end | self-start | self-end

align-content: normal | flex-start | flex-end | center | space-between | space-around | space-evenly | stretch
  */
  .container {
   display: flex;                  /* Flexbox enabled */
	flex-direction:row; 
	/*gap:10px 20px;*/
	/*row-gap:10px; */
	/*column-gap:10px;*/
    /* flex-wrap: wrap;                Allows wrapping */
    /*  justify-content: center;   Space distribution horizontally */
     /* align-items: center ;           Align items vertically */
    /*align-content: flex-start;*/
	border: 2px solid maroon;
    height: 300px;
  }

  .box {
    background: lightblue;
    border: 1px solid #333;
    padding: 5px;
    /*margin: 10px;*/
	width:120px;
    text-align: center;
	/*flex-basis:25%; */
	height:50px;
  }
  
  
 #box1{
    order:1;
	flex-grow:1;
	align-self:flex-end;
	
 }
  #box2{
    order:2;
	flex-shrink:2;
 }
  
 /* 
order: integer                    /* default 0; negative allowed */

flex-grow: number ≥ 0             /* default 0 */

flex-shrink: number ≥ 0           /* default 1 */

flex-basis: auto | content | length | percentage   /* default auto; e.g. 200px, 25%, 10rem */

flex: none | auto | initial | flex-grow flex-shrink flex-basis
      /* none = 0 0 auto | auto = 1 1 auto | initial = 0 1 auto | e.g. flex: 1  →  1 1 0% */

align-self: auto | stretch | flex-start | flex-end | center | baseline | first baseline | last baseline | start | end | self-start | self-end
      /* default auto — inherits the container's align-items */

*/
</style>
</head>
<body>
  <h2>Flex Boxes Example</h2>
<!--
 <div class="container">
    <div class="box">Box 1</div>
	<div class="box">Box 2</div>
	<div class="box">Box 3</div>
	<div class="box">Box 4</div>
	<div class="box">Box 5</div>
	<div class="box">Box 6</div>
	<div class="box">Box 7</div>
	<div class="box">Box 8</div>
  </div> -->
 
  <div class="container">
    <div class="box" id="box1">Box 1</div>
	<div class="box" id="box2">Box 2</div>
	<div class="box" id="box3">Box 3</div>
	<div class="box" id="box4">Box 4</div>
	<div class="box" id="box5">Box 5</div>
	<div class="box" id="box6">Box 6</div>
	<div class="box" id="box7">Box 7</div>
	<div class="box" id="box8">Box 8</div>
  </div> 
</body>
</html>
