<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transform Real-Time Use-Cases</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 20px;
      line-height: 1.6;
    }

    h2 {
      margin: 20px 0 10px;
      color: #333;
    }

    section {
      background: #fff;
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    /* 1. Button Feedback */
    button {
      padding: 12px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    button:hover {
      transform: scale(1.05);
    }
    button:active {
      transform: scale(0.95);
    }

    /* 2. Image Zoom */
    .card img {
      width: 200px;
      border-radius: 6px;
      transition: transform 0.4s ease;
    }
    .card img:hover {
      transform: scale(1.2);
    }

    /* 3. Sidebar Menu */
    .sidebar {
      position: fixed;
      top: 0; left: -250px;
      width: 250px;
      height: 100%;
      background: #333;
      color: white;
      padding: 20px;
      transition: transform 0.3s ease;
    }
    .sidebar.open {
      transform: translateX(250px);
    }
    .menu-btn {
      margin-top: 10px;
	  margin-left: 250px;
	  
    }

    /* 4. Flipping Card */
    .card-container {
      width: 200px;
      height: 300px;
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }
    .card-container:hover .card-inner {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 6px;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .card-front {
      background: tomato;
      color: white;
    }
    .card-back {
      background: lightgray;
      transform: rotateY(180deg);
    }

    /* 5. Loader (Rotate) */
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 1. Button Feedback -->
  <section>
    <h2>1. Button Feedback (Scale on Hover/Click)</h2>
    <button>Click Me</button>
  </section>

  <!-- 2. Image Zoom -->
  <section>
    <h2>2. Image Zoom on Hover</h2>
    <div class="card">
      <img src="Library.jpg" alt="Sample">
    </div>
  </section>

  <!-- 3. Sidebar Menu -->
  <section>
    <h2>3. Sidebar Menu (Translate)</h2>
    <button class="menu-btn" onclick="toggleMenu()">Toggle Menu</button>
    <div id="sidebar" class="sidebar">
      <h3>Menu</h3>
      <p>Home</p>
      <p>About</p>
      <p>Contact</p>
    </div>
  </section>

  <!-- 4. Flipping Card -->
  <section>
    <h2>4. Flipping Card (RotateY)</h2>
    <div class="card-container">
      <div class="card-inner">
        <div class="card-front">Front</div>
        <div class="card-back">Back</div>
      </div>
    </div>
  </section>

  <!-- 5. Loader -->
  <section>
    <h2>5. Loader (Rotate Animation)</h2>
    <div class="loader"></div>
  </section>

  <script>
    function toggleMenu() {
      document.getElementById('sidebar').classList.toggle('open');
    }
  </script>
</body>
</html>
