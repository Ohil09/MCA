<html>
<head>
<style>
.div1 p {
  color: yellow;
}
.div2+p {
  color: red;
}
.div3>p {
  color: green;
}
.div4~p {
  color: blue;
}
</style>
</head>
<body>
<div>
<p>Paragraph 6</p>
<div class="div4">
  <p>Paragraph 1</p>
  <p>Paragraph 2</p>
  <span><p>Paragraph 3 </p></span>
</div>

<p>Paragraph 4</p>
<p>Paragraph 5</p>
</div>
</body>

</html>
